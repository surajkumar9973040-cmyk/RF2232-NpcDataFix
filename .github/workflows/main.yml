name: Build RF2232 NpcDataFix

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout repository and pinned MinHook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64

      - name: Guard standalone dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Get-Content '.\NpcDataFix.vcxproj' -Raw
          $forbidden = @(
            'YorozuyaGSLib',
            'ModuleRegistry',
            'ATFRegistry',
            '<ProjectReference'
          )

          foreach ($value in $forbidden) {
            if ($project.Contains($value)) {
              throw "Forbidden dependency in standalone project: $value"
            }
          }

          $required = @(
            '<PlatformToolset>v143</PlatformToolset>',
            '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>',
            '<ConfigurationType>DynamicLibrary</ConfigurationType>'
          )
          foreach ($value in $required) {
            if (-not $project.Contains($value)) {
              throw "Required standalone build setting is missing: $value"
            }
          }

          [xml]$xml = $project
          $manager = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $manager.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $compiled = @($xml.SelectNodes('//msb:ClCompile[@Include]', $manager) |
            ForEach-Object { $_.Include })
          $expected = @(
            'src\NpcDataFallback.cpp',
            'src\NpcDataFix.cpp',
            'src\RuntimeDiagnostics.cpp',
            'third_party\minhook\src\buffer.c',
            'third_party\minhook\src\hook.c',
            'third_party\minhook\src\trampoline.c',
            'third_party\minhook\src\hde\hde64.c'
          )

          if (Compare-Object $expected $compiled) {
            throw 'Standalone DLL compile graph differs from the seven audited translation units.'
          }

          $actualMinHook = git -C '.\third_party\minhook' rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or
              $actualMinHook -ne 'c3fcafdc10146beb5919319d0683e44e3c30d537') {
            throw "Unexpected MinHook revision: $actualMinHook"
          }

      - name: Build Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item '.\build' -ItemType Directory -Force | Out-Null

          msbuild '.\RF2232-NpcDataFix.sln' `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /bl:build\RF2232-NpcDataFix.binlog

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Run fallback tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\build\x64\Release\NpcDataFixTests.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "Fallback tests failed with exit code $LASTEXITCODE"
          }

      - name: Build diagnostic DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild '.\RF2232-NpcDataFix.sln' `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:NpcDataFixDiagnostics=true

          if ($LASTEXITCODE -ne 0) {
            throw "Diagnostic DLL build failed with exit code $LASTEXITCODE"
          }

      - name: Verify DLL architecture, exports, and runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = '.\build\x64\Release\YorozuyaGS.dll'
          $diagnosticDll = '.\build\x64\Release\YorozuyaGS-diagnostic.dll'

          foreach ($file in @($dll, $diagnosticDll)) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Expected DLL was not produced: $file"
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $dumpbin = @(& $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe') |
            Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($dumpbin) -or
              -not (Test-Path $dumpbin -PathType Leaf)) {
            throw 'dumpbin.exe was not found in the Visual Studio C++ toolset.'
          }

          foreach ($file in @($dll, $diagnosticDll)) {
            $headers = & $dumpbin /headers $file | Out-String
            $exports = & $dumpbin /exports $file | Out-String
            $dependencies = & $dumpbin /dependents $file | Out-String

            if ($headers -notmatch 'machine \(x64\)') {
              throw "$file is not x64."
            }
            $exportPattern = '(?m)^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)(?:\s+=.*)?$'
            $exportNames = @([regex]::Matches($exports, $exportPattern) |
              ForEach-Object { $_.Groups[1].Value })
            if (Compare-Object @('YorozuyaGS') $exportNames) {
              throw "$file exports differ from the single required YorozuyaGS symbol: $exportNames"
            }
            $dependencyPattern = '(?im)^\s+([A-Z0-9_.-]+\.dll)\s*$'
            $dependencyNames = @([regex]::Matches($dependencies, $dependencyPattern) |
              ForEach-Object { $_.Groups[1].Value.ToUpperInvariant() })
            if (Compare-Object @('KERNEL32.DLL') $dependencyNames) {
              throw "Unexpected dependencies in ${file}: $dependencyNames"
            }

            Write-Host $dependencies
          }

      - name: Prepare installation package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = '.\package'

          New-Item $out -ItemType Directory -Force | Out-Null
          Copy-Item '.\build\x64\Release\YorozuyaGS.dll' $out
          New-Item (Join-Path $out 'diagnostic') -ItemType Directory -Force | Out-Null
          Copy-Item '.\build\x64\Release\YorozuyaGS-diagnostic.dll' `
            (Join-Path $out 'diagnostic\YorozuyaGS.dll')
          Copy-Item '.\README-INSTALL.txt' $out
          Copy-Item '.\LICENSE-Yorozuya.txt' $out
          Copy-Item '.\third_party\minhook\LICENSE.txt' `
            (Join-Path $out 'LICENSE-MinHook.txt')

          Get-FileHash (Join-Path $out 'YorozuyaGS.dll') -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) *YorozuyaGS.dll" } |
            Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          Get-FileHash (Join-Path $out 'diagnostic\YorozuyaGS.dll') -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) *diagnostic/YorozuyaGS.dll" } |
            Add-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii

          $expected = @(
            'YorozuyaGS.dll',
            'README-INSTALL.txt',
            'LICENSE-Yorozuya.txt',
            'LICENSE-MinHook.txt',
            'SHA256SUMS.txt'
          )
          $actual = @(Get-ChildItem $out -File | ForEach-Object { $_.Name })
          if (Compare-Object $expected $actual) {
            throw 'Installation package contains an unexpected file set.'
          }
          if (-not (Test-Path (Join-Path $out 'diagnostic\YorozuyaGS.dll') -PathType Leaf)) {
            throw 'Diagnostic DLL is missing from installation package.'
          }

          Get-ChildItem $out -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload RF2232-NpcDataFix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RF2232-NpcDataFix
          path: package/
          if-no-files-found: error
          retention-days: 90
