name: Build RF2232 NpcData-only fix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone upstream Yorozuya
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/goodwinxp/Yorozuya.git upstream

      - name: Retarget project and strip YorozuyaGS to NpcData-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'upstream'

          # GitHub's Windows runner has VS2022/v143. Retarget the old VS2017 projects.
          Get-ChildItem $root -Recurse -File -Include *.vcxproj | ForEach-Object {
            $text = Get-Content $_.FullName -Raw

            if ($null -eq $text) {
              return
            }

            $text = $text.Replace(
              '<WindowsTargetPlatformVersion>10.0.16299.0</WindowsTargetPlatformVersion>',
              '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>'
            )

            $text = $text.Replace(
              '<PlatformToolset>v141</PlatformToolset>',
              '<PlatformToolset>v143</PlatformToolset>'
            )

            Set-Content -Path $_.FullName -Value $text -Encoding UTF8
          }

          # VS2022 uses std::filesystem instead of the old experimental namespace.
          Get-ChildItem $root -Recurse -File -Include *.h,*.hpp,*.cpp | ForEach-Object {
            $text = Get-Content $_.FullName -Raw

            if ($null -eq $text) {
              return
            }

            if ($text.Contains('::std::experimental::filesystem::v1')) {
              $text = $text.Replace(
                '::std::experimental::filesystem::v1',
                '::std::filesystem'
              )
              Set-Content -Path $_.FullName -Value $text -Encoding UTF8
            }
          }

          # Compile only the NpcData fix plus the tiny YorozuyaGS core it requires.
          $proj = Join-Path $root 'YorozuyaGS\YorozuyaGS.vcxproj'
          [xml]$xml = Get-Content $proj -Raw

          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')

          $keep = @(
            'Common\ModuleRegistry.cpp',
            'dllmain.cpp',
            'NpcData\NpcData.cpp',
            'stdafx.cpp',
            'Yorozuya.cpp'
          )

          $nodes = @($xml.SelectNodes('//msb:ClCompile', $ns))
          foreach ($node in $nodes) {
            if ($keep -notcontains $node.Include) {
              [void]$node.ParentNode.RemoveChild($node)
            }
          }

          $xml.Save($proj)

          Write-Host 'YorozuyaGS .cpp files that remain enabled:'
          [xml]$check = Get-Content $proj -Raw
          $ns2 = New-Object System.Xml.XmlNamespaceManager($check.NameTable)
          $ns2.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $check.SelectNodes('//msb:ClCompile', $ns2) |
            ForEach-Object { Write-Host ('  ' + $_.Include) }

      - name: Build NpcData-only DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'upstream'
          $solutionDir = $root + '\'

          msbuild `
            (Join-Path $root 'YorozuyaGS\YorozuyaGS.vcxproj') `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SolutionDir="$solutionDir"

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path $PWD 'upstream'
          $out = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force $out | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $out 'YorozuyaGS') | Out-Null

          $dll = Get-ChildItem $root -Recurse -Filter YorozuyaGS.dll |
            Select-Object -First 1

          if (-not $dll) {
            throw 'YorozuyaGS.dll was not produced'
          }

          Copy-Item $dll.FullName (Join-Path $out 'YorozuyaGS.dll')

          @'
          {
            "intervals": {
              "open_world_wait": 1000,
              "step_delay": 1000
            },
            "registry": {
              "modules": []
            }
          }
          '@ | Set-Content `
            (Join-Path $out 'YorozuyaGS\global.json') `
            -Encoding UTF8

          Copy-Item `
            (Join-Path $root 'RFOnline addon for server.zip') `
            (Join-Path $out 'RFOnline addon for server.zip')

          Copy-Item `
            (Join-Path $root 'LICENSE') `
            (Join-Path $out 'Yorozuya-LICENSE.txt')

          @'
          RF Online 2.2.3.2 - NpcData-only experimental build

          Source:
          https://github.com/goodwinxp/Yorozuya

          Only the built-in fix.npc_data game module is compiled into YorozuyaGS.dll.
          The other built-in Yorozuya game modules are excluded at compile time.

          Upstream NpcData behavior retained:
            Update_NpcData
              -> if it fails: Insert_NpcData
              -> retry Update_NpcData

          The paired AnimusData fallback remains because it is part of the same
          upstream save hook.

          IMPORTANT:
          Back up the complete ZoneServer folder before testing.
          '@ | Set-Content (Join-Path $out 'README-FIRST.txt') -Encoding UTF8

          Get-ChildItem $out -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RF2232-NpcDataFix
          path: package/
          if-no-files-found: error
